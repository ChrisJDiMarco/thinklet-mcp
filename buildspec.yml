version: 0.2

env:
  variables:
    AWS_ACCOUNT_ID: "891612574251"
    AWS_DEFAULT_REGION: "us-east-1"
    ECR_REPO: "thinklet/mcp"
    IMAGE_TAG: "latest"

phases:
  pre_build:
    commands:
      - echo Logging in to Amazon ECR...
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - REPO_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$ECR_REPO
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-7)
      - IMAGE_URI=$REPO_URI:$COMMIT_HASH

  build:
    commands:
      - echo Building Docker image...
      - docker build --platform linux/arm64 -t $REPO_URI:$IMAGE_TAG -t $IMAGE_URI .
      - echo Build completed

  post_build:
    commands:
      - echo Pushing images to ECR...
      - docker push $REPO_URI:$IMAGE_TAG
      - docker push $IMAGE_URI
      - echo Writing image definitions file...
      - printf '[{"name":"thinklet-mcp","imageUri":"%s"}]' $IMAGE_URI > imagedefinitions.json
      - cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
