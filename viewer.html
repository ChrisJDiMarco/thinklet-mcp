<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self' 'unsafe-inline' 'unsafe-eval' blob: data: https://esm.sh https://cdn.esm.sh https://content.thinklet.io; frame-src 'self' blob: data: https://content.thinklet.io; connect-src 'self' blob: data: https://esm.sh https://cdn.esm.sh https://content.thinklet.io https://api.thinklet.io; img-src 'self' blob: data: https:;" />
    <title>Thinklet</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; min-height: 480px; overflow: auto; background: #fff; }
      #root { width: 100%; min-height: 100%; display: none; }
      #loading {
        display: flex; align-items: center; justify-content: center;
        width: 100%; height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
        color: #888; font-size: 14px;
      }
      #loading .spinner {
        width: 20px; height: 20px; border: 2px solid #e5e5e5;
        border-top-color: #888; border-radius: 50%;
        animation: spin 0.6s linear infinite; margin-right: 10px;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      #error {
        display: none; align-items: center; justify-content: center;
        width: 100%; height: 100%;
        font-family: system-ui, -apple-system, sans-serif;
        color: #666; font-size: 13px; text-align: center; padding: 24px;
      }
    </style>
  </head>
  <body>
    <div id="loading"><div class="spinner"></div>Loading thinklet…</div>
    <div id="error"></div>
    <div id="root"></div>
    <script type="module" src="./src/viewer.ts"></script>
  </body>
</html>
